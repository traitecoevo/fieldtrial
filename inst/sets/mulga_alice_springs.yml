schema: 1
name: mulga_alice_springs
description: "Mulga (Acacia aptaneura, formerly A. aneura var. tenuis) at the Alice Springs Mulga flux site, AU-ASM, Ti Tree, NT. Values measured at the site or elsewhere in the Ti Tree basin first; AusTraits means for Acacia aneura sensu lato where those have none. Stem and root P50 are a flagged proxy."
model: TF24
plant_scientific_version: "TF24@v15"
site: {name: "Alice Springs Mulga (AU-ASM)", latitude: -22.283, longitude: 133.249, elevation: 606}
traits:
  lma: {value: 0.4579142, source: "Falster-2021 (AusTraits): austraits-means 7.0.0.9000 geometric observed mean for Acacia aneura, 457.9142 g m-2, 48 records from 27 locations, 12 datasets"}
  rho: {value: 950, source: "Santini-2016 (doi:10.1007/s00468-015-1301-5), Table 1: A. aneura branch wood density 0.95 +/- 0.07 g cm-3, Ti Tree Basin, n = 6"}
  omega: {value: 1.345313e-05, source: "Falster-2021 (AusTraits): austraits-means 7.0.0.9000 geometric observed mean for Acacia aneura seed dry mass, 13.45313 mg, 108 records from 5 locations"}
  vcmax_25: {value: 174.0, source: "Nolan-2017 (doi:10.1071/fp17096; mulga-library, not in Zotero), Table 1: A. aptaneura Vcmax 174.0 +/- 36.8 umol m-2 s-1 at 25 C, AU-ASM wet season 2016, n = 4 trees"}
  jmax_25: {value: 233.4, source: "Nolan-2017 (doi:10.1071/fp17096), Table 1: A. aptaneura Jmax 233.4 +/- 28.9 umol m-2 s-1 at 25 C, AU-ASM, n = 4 trees"}
tradeoff_coefficients:
  B_Hv1: {value: 0.73128415612006736, source: "PROXY. Set so stem_P50 = 6.7 MPa at plant's default K_s: no stem P50 for any mulga taxon was found. 6.7 MPa is the leaf water potential at stomatal closure in A. aptaneura at AU-ASM (Nolan-2018a, doi:10.1016/j.jaridenv.2018.01.003; mulga-library), a lower bound on P50. Midday leaf water potential there reaches -6.5 to -6.9 MPa (Nolan-2017b, doi:10.1071/fp17079; Nolan-2018a)."}
pars:
  theta: {value: 1.57e-03, source: "Nolan-2018a (doi:10.1016/j.jaridenv.2018.01.003), Table 2: A. aptaneura Huber value 15.7 +/- 1.6 x 1e-4, branches of 4 trees, AU-ASM"}
  hmat: {value: 4.700879, source: "Falster-2021 (AusTraits): austraits-means 7.0.0.9000 geometric observed mean plant height for Acacia aneura, 416 records from 330 locations; a proxy for height at maturation, which has no direct measurement. Canopy at the tower averages 6.5 m, trees 3-7 m (Tarin-2020a, doi:10.1016/j.agrformet.2019.107853)"}
  root_P50: {value: 6.7, source: "PROXY, as for B_Hv1: stomatal closure at -6.7 MPa in A. aptaneura (Nolan-2018a). No root vulnerability curve for any mulga taxon was found"}
environment:
  soil:
    depth: {value: 1.0, source: "Cleverly-2016 (doi:10.1016/j.scitotenv.2016.05.142): the top of the hardpan runs from the surface to more than 1 m at the tower; roots mostly above 0.75 m"}
    n_layers: {value: 5, source: "fieldtrial: numerical resolution of the column"}
    top: {value: 0.02, source: "fieldtrial: plant's default surface-layer width"}
    soil_moist_sat: {value: 0.35, source: "Cleverly-2016 (doi:10.1016/j.scitotenv.2016.05.142): soil porosity 0.35 +/- 0.006, n = 95, AU-ASM"}
drivers:
  source: worldclim
  res: 10
  rainfall: spline
  leaf_temp: true
provenance:
  author: "Daniel Falster, with Claude"
  date: "2026-11-10"
  notes: >-
    Decided with the maintainer 2026-11-10: site-measured A. aptaneura values first and
    AusTraits A. aneura sensu lato means to fill; stem and root P50 from stomatal closure
    as a flagged proxy, pending a measured vulnerability curve; hmat from AusTraits mean
    plant height; soil to the hardpan at 1.0 m. K_sat stays at plant's default because
    plant does not document its units, so the ASRIS sandy-loam value (1.0 m d-1, Chen-2014)
    cannot be converted. Not set, for lack of mulga data: K_s (sapwood-specific
    conductivity; only anatomical indices exist), stem_c, root_c, leaf lifespan. leaf_temp
    is set from the site's noon air temperature, because at plant's 25 C the leaf refuses
    the noon VPD on about half of the days.
